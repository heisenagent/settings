# sample hypridle.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # to avoid having to press a key twice to turn on the display.
}

# Replaced by the fade below (both would save and restore the laptop backlight).
# listener {
#     timeout = 150                                # 2.5min.
#     on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
#     on-resume = brightnessctl -r                 # monitor backlight restore.
# }

# Slowly dim the laptop screen and external monitors during the 30 seconds
# before the lock, as a warning to move the mouse.
listener {
    timeout = 270                                 # 4.5min.
    on-timeout = ~/.config/hypr/scripts/dim.sh fade 30
    on-resume = ~/.config/hypr/scripts/dim.sh restore
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 300                                 # 5min.
    on-timeout = loginctl lock-session            # lock screen when timeout has passed.
}

listener {
    timeout = 330                                 # 5.5min.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'  # screen off when timeout has passed.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min.
    on-timeout = systemctl suspend                # suspend pc.
}
